<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Shark</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        #title {
            color: #fff;
            font-size: 2.5em;
            font-weight: bold;
            margin: 20px 0 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        #gameWrapper {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        #gameContainer {
            position: relative;
            width: 1000px;
            height: 500px;
            background: #1a1a1a;
            border: 20px solid #3d2817;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(0,0,0,0.9), inset 0 0 30px rgba(0,0,0,0.5);
            cursor: crosshair;
            touch-action: none;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #fff;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 3px;
        }
        #comboDisplay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            display: none;
        }
        #sidebar {
            width: 200px;
            color: #fff;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .player-panel {
            background: rgba(0,0,0,0.5);
            padding: 12px;
            border-radius: 8px;
            border: 2px solid transparent;
        }
        .player-panel.active {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.2);
        }
        .player-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .player-type {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 8px;
        }
        .balls-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 8px;
            min-height: 30px;
        }
        .ball-icon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .remaining-count {
            font-size: 12px;
            color: #aaa;
        }
        .win-count {
            font-size: 13px;
            font-weight: bold;
            color: #FFD700;
            margin-top: 5px;
            padding-top: 5px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }
        #winnerScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #winnerContent {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            color: #fff;
            border: 2px solid #FFD700;
        }
        #winnerContent h1 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #FFD700;
        }
        #winnerContent p {
            font-size: 1.5em;
            margin-bottom: 30px;
        }
        #playAgainBtn {
            padding: 15px 40px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #playAgainBtn:hover {
            background: #45a049;
        }
        #modeSelectScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1002;
            justify-content: center;
            align-items: center;
        }
        #modeSelectContent {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            color: #fff;
            border: 2px solid #4CAF50;
            min-width: 400px;
        }
        #modeSelectContent h1 {
            font-size: 2em;
            margin-bottom: 30px;
            color: #4CAF50;
        }
        .mode-btn {
            padding: 15px 30px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 10px;
            min-width: 150px;
        }
        .mode-btn:hover {
            background: #45a049;
        }
        #nameInputScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }
        #nameInputContent {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            color: #fff;
            border: 2px solid #4CAF50;
            min-width: 400px;
        }
        #nameInputContent h1 {
            font-size: 2em;
            margin-bottom: 30px;
            color: #4CAF50;
        }
        .name-input-group {
            margin-bottom: 20px;
        }
        .name-input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .name-input-group input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #4CAF50;
            border-radius: 5px;
            background: #333;
            color: #fff;
        }
        #startGameBtn {
            padding: 12px 30px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
        #startGameBtn:hover {
            background: #45a049;
        }
        .shot-feedback {
            position: fixed;
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 100;
        }
        #aiThinkingIndicator {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 14px;
            color: #FFD700;
            background: rgba(0,0,0,0.7);
            padding: 8px 15px;
            border-radius: 5px;
            display: none;
        }
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="title">Pool Shark</div>
    <div id="gameWrapper">
        <div id="gameContainer">
            <canvas id="poolTable"></canvas>
            <div id="info">Drag to aim. Release to shoot.</div>
            <div id="comboDisplay"></div>
            <div id="aiThinkingIndicator">🤖 Thinking...</div>
        </div>
        <div id="sidebar">
            <div class="player-panel active" id="player1Panel">
                <div class="player-name" id="player1Name">Player 1</div>
                <div class="player-type" id="player1Type">Solids</div>
                <div class="balls-grid" id="player1Balls"></div>
                <div class="remaining-count" id="player1Remaining">Balls remaining: 7</div>
                <div class="win-count" id="player1Wins">Wins: 0</div>
            </div>
            <div class="player-panel" id="player2Panel">
                <div class="player-name" id="player2Name">Player 2</div>
                <div class="player-type" id="player2Type">Stripes</div>
                <div class="balls-grid" id="player2Balls"></div>
                <div class="remaining-count" id="player2Remaining">Balls remaining: 7</div>
                <div class="win-count" id="player2Wins">Wins: 0</div>
            </div>
        </div>
    </div>

    <div id="modeSelectScreen">
        <div id="modeSelectContent">
            <h1>Select Game Mode</h1>
            <button class="mode-btn" id="twoPlayerBtn">👥 2 Players</button>
            <button class="mode-btn" id="vsComputerBtn">🤖 vs Computer</button>
        </div>
    </div>

    <div id="nameInputScreen">
        <div id="nameInputContent">
            <h1>Pool Shark</h1>
            <div class="name-input-group" id="player1NameGroup">
                <label for="player1NameInput">Player 1 (Solids)</label>
                <input type="text" id="player1NameInput" placeholder="Enter name" value="Player 1">
            </div>
            <div class="name-input-group" id="player2NameGroup">
                <label for="player2NameInput">Player 2 (Stripes)</label>
                <input type="text" id="player2NameInput" placeholder="Enter name" value="Player 2">
            </div>
            <button id="startGameBtn">Start Game</button>
        </div>
    </div>

    <div id="winnerScreen">
        <div id="winnerContent">
            <h1 id="winnerText">Player 1 Wins!</h1>
            <p id="winnerSubtext">Pocketed the 8-ball!</p>
            <button id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('poolTable');
        const ctx = canvas.getContext('2d');

        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        const BALL_RADIUS = 5;
        const FRICTION = 0.985;
        const POCKET_RADIUS = 8;
        const TABLE_WIDTH = canvas.width;
        const TABLE_HEIGHT = canvas.height;
        const WALL_PADDING = 15;
        const MIN_VELOCITY = 0.1;

        const POCKETS = [
            { x: WALL_PADDING, y: WALL_PADDING },
            { x: TABLE_WIDTH / 2, y: WALL_PADDING },
            { x: TABLE_WIDTH - WALL_PADDING, y: WALL_PADDING },
            { x: WALL_PADDING, y: TABLE_HEIGHT - WALL_PADDING },
            { x: TABLE_WIDTH / 2, y: TABLE_HEIGHT - WALL_PADDING },
            { x: TABLE_WIDTH - WALL_PADDING, y: TABLE_HEIGHT - WALL_PADDING },
        ];

        const COLORS = [
            '#fff', '#ffeb3b', '#F44336', '#000080', '#800080', '#FF6B35',
            '#00AA00', '#8B4513', '#000', '#ffeb3b', '#F44336', '#000080',
            '#800080', '#FF6B35', '#00AA00', '#8B4513'
        ];

        function playSound(freq, duration, type = 'sine', volume = 0.3) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.value = freq;
            osc.type = type;
            gain.gain.setValueAtTime(volume, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + duration);
        }

        function ballCollisionSound() {
            playSound(400, 0.1, 'sine', 0.2);
            playSound(600, 0.08, 'sine', 0.15);
        }

        function cushionSound() {
            playSound(200, 0.15, 'sine', 0.25);
        }

        function pocketSound() {
            playSound(800, 0.1, 'sine', 0.3);
            setTimeout(() => playSound(1200, 0.15, 'sine', 0.3), 50);
        }

        function screenShake(intensity = 5) {
            const originalTransform = canvas.style.transform;
            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    const x = (Math.random() - 0.5) * intensity * 2;
                    const y = (Math.random() - 0.5) * intensity * 2;
                    canvas.style.transform = `translate(${x}px, ${y}px)`;
                }, i * 30);
            }
            setTimeout(() => {
                canvas.style.transform = originalTransform;
            }, 200);
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '-10px';
                confetti.style.background = ['#FFD700', '#4CAF50', '#FF6B35', '#00BFFF'][Math.floor(Math.random() * 4)];
                confetti.style.opacity = '1';
                document.body.appendChild(confetti);

                const duration = 3000 + Math.random() * 2000;
                const startTime = Date.now();
                const velocityX = (Math.random() - 0.5) * 10;
                const velocityY = Math.random() * 8 + 5;

                const animate = () => {
                    const elapsed = Date.now() - startTime;
                    const progress = elapsed / duration;

                    if (progress > 1) {
                        confetti.remove();
                        return;
                    }

                    const x = parseFloat(confetti.style.left) + velocityX;
                    const y = parseFloat(confetti.style.top) + velocityY + progress * 2;
                    confetti.style.left = x + 'px';
                    confetti.style.top = y + 'px';
                    confetti.style.opacity = 1 - progress;
                    confetti.style.transform = `rotate(${elapsed * 0.3}deg)`;

                    requestAnimationFrame(animate);
                };
                animate();
            }
        }

        let balls = [];
        let gameState = 'playing';
        let currentPlayer = 1;
        let player1Name = 'Player 1';
        let player2Name = 'Player 2';
        let player1Score = 0;
        let player2Score = 0;
        let player1Wins = 0;
        let player2Wins = 0;
        let ballsPocketedThisTurn = [];
        let gameOver = false;
        let winner = null;
        let pocketedBalls = { 1: [], 2: [] };
        let gameMode = '2player'; // '2player' or 'vscomputer'
        let isComputerTurn = false;
        let computerThinking = false;
        let computerHasShot = false; // Flag to prevent computer from shooting twice per turn
        let shotTaken = false; // Flag to track if shot has been taken this turn
        let slowMotion = false;
        let slowMotionCounter = 0;
        let comboCount = 0;
        let ballTrails = [];

        let dragging = false;
        let dragStart = null;
        let dragCurrent = null;
        let shotPower = 0;

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.life = 1.0;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.size = Math.random() * 3 + 2;
            }

            update() {
                this.life -= 0.02;
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2; // gravity
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let particles = [];

        class Ball {
            constructor(x, y, colorIndex = 0) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.colorIndex = colorIndex;
                this.radius = BALL_RADIUS;
                this.scale = 1;
                this.pocketAnimation = false;
                this.trail = [];
            }

            update() {
                if (this.pocketAnimation) return;

                // Record trail
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 15) this.trail.shift();

                this.vx *= FRICTION;
                this.vy *= FRICTION;

                if (Math.abs(this.vx) < MIN_VELOCITY) this.vx = 0;
                if (Math.abs(this.vy) < MIN_VELOCITY) this.vy = 0;

                this.x += this.vx;
                this.y += this.vy;

                if (this.x - this.radius < WALL_PADDING) {
                    this.x = WALL_PADDING + this.radius;
                    this.vx *= -0.95;
                    cushionSound();
                }
                if (this.x + this.radius > TABLE_WIDTH - WALL_PADDING) {
                    this.x = TABLE_WIDTH - WALL_PADDING - this.radius;
                    this.vx *= -0.95;
                    cushionSound();
                }
                if (this.y - this.radius < WALL_PADDING) {
                    this.y = WALL_PADDING + this.radius;
                    this.vy *= -0.95;
                    cushionSound();
                }
                if (this.y + this.radius > TABLE_HEIGHT - WALL_PADDING) {
                    this.y = TABLE_HEIGHT - WALL_PADDING - this.radius;
                    this.vy *= -0.95;
                    cushionSound();
                }
            }

            drawTrail() {
                if (this.trail.length < 2) return;
                ctx.strokeStyle = `rgba(255, 255, 255, 0.3)`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.trail[0].x, this.trail[0].y);
                for (let i = 1; i < this.trail.length; i++) {
                    ctx.lineTo(this.trail[i].x, this.trail[i].y);
                }
                ctx.stroke();
            }

            draw() {
                if (this.pocketAnimation) {
                    this.scale *= 0.92;
                    if (this.scale < 0.05) {
                        this.scale = 0;
                        return;
                    }
                }

                this.drawTrail();

                ctx.save();
                ctx.globalAlpha = Math.max(0, this.scale);

                // 3D ball with gradient
                const gradient = ctx.createRadialGradient(
                    this.x - this.radius * 0.3, this.y - this.radius * 0.3, 0,
                    this.x, this.y, this.radius
                );
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
                gradient.addColorStop(0.5, COLORS[this.colorIndex]);
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0.3)');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Shine highlight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();

                // Stripes
                if (this.colorIndex >= 9 && this.colorIndex <= 15) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(this.x - this.radius * 0.7, this.y);
                    ctx.lineTo(this.x + this.radius * 0.7, this.y);
                    ctx.stroke();
                }

                // Numbers
                if (this.colorIndex > 0 && this.colorIndex !== 8) {
                    ctx.fillStyle = this.colorIndex <= 7 ? '#000' : '#fff';
                    ctx.font = 'bold 6px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.colorIndex, this.x, this.y);
                }

                if (this.colorIndex === 8) {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 6px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('8', this.x, this.y);
                }

                ctx.restore();
            }

            isMoving() {
                return Math.abs(this.vx) > MIN_VELOCITY || Math.abs(this.vy) > MIN_VELOCITY;
            }
        }

        function initGame() {
            balls = [];
            ballsPocketedThisTurn = [];
            gameOver = false;
            winner = null;
            currentPlayer = 1;
            player1Score = 0;
            player2Score = 0;
            gameState = 'playing';
            pocketedBalls = { 1: [], 2: [] };
            comboCount = 0;
            slowMotion = false;
            shotTaken = false;
            computerHasShot = false;
            isComputerTurn = false; // Human always goes first
            computerThinking = false;
            particles = [];
            document.getElementById('winnerScreen').style.display = 'none';

            balls.push(new Ball(TABLE_WIDTH * 0.25, TABLE_HEIGHT / 2, 0));

            const startX = TABLE_WIDTH * 0.65;
            const startY = TABLE_HEIGHT / 2;
            const spacing = BALL_RADIUS * 2.5;
            let colorIndex = 1;

            for (let row = 0; row < 5; row++) {
                for (let col = 0; col <= row; col++) {
                    const x = startX + row * spacing;
                    const y = startY - (row * spacing) / 2 + col * spacing;
                    balls.push(new Ball(x, y, colorIndex));
                    colorIndex++;
                }
            }

            updateUI();
        }

        function checkPocketCollision(ball) {
            for (let pocket of POCKETS) {
                const dx = ball.x - pocket.x;
                const dy = ball.y - pocket.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < POCKET_RADIUS) {
                    return true;
                }
            }
            return false;
        }

        function checkBallCollision(ball1, ball2) {
            const dx = ball2.x - ball1.x;
            const dy = ball2.y - ball1.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const minDistance = ball1.radius + ball2.radius;

            if (distance < minDistance) {
                const nx = dx / distance;
                const ny = dy / distance;

                const dvx = ball2.vx - ball1.vx;
                const dvy = ball2.vy - ball1.vy;

                const dvDotN = dvx * nx + dvy * ny;

                if (dvDotN < 0) {
                    ball1.vx += dvDotN * nx;
                    ball1.vy += dvDotN * ny;
                    ball2.vx -= dvDotN * nx;
                    ball2.vy -= dvDotN * ny;

                    ballCollisionSound();

                    const overlap = (minDistance - distance) / 2 + 0.5;
                    ball1.x -= overlap * nx;
                    ball1.y -= overlap * ny;
                    ball2.x += overlap * nx;
                    ball2.y += overlap * ny;
                }
            }
        }

        function isPlayerBall(colorIndex, playerNum) {
            if (colorIndex === 0) return false;
            if (colorIndex === 8) return false;

            if (playerNum === 1) {
                return colorIndex >= 1 && colorIndex <= 7;
            } else {
                return colorIndex >= 9 && colorIndex <= 15;
            }
        }

        function update() {
            if (gameOver) return;

            if (slowMotion) {
                slowMotionCounter++;
                if (slowMotionCounter > 300) {
                    slowMotion = false;
                    slowMotionCounter = 0;
                }
            }

            const updateFrames = slowMotion ? 1 : 1;
            for (let frame = 0; frame < updateFrames; frame++) {
                for (let ball of balls) {
                    ball.update();
                }

                for (let i = 0; i < balls.length; i++) {
                    for (let j = i + 1; j < balls.length; j++) {
                        checkBallCollision(balls[i], balls[j]);
                    }
                }

                for (let i = balls.length - 1; i >= 0; i--) {
                    if (checkPocketCollision(balls[i])) {
                        const ball = balls[i];

                        if (ball.colorIndex === 0) {
                            ball.x = TABLE_WIDTH * 0.25;
                            ball.y = TABLE_HEIGHT / 2;
                            ball.vx = 0;
                            ball.vy = 0;
                        } else {
                            ball.pocketAnimation = true;
                            ballsPocketedThisTurn.push(ball.colorIndex);
                            if (isPlayerBall(ball.colorIndex, 1)) {
                                pocketedBalls[1].push(ball.colorIndex);
                            } else if (isPlayerBall(ball.colorIndex, 2)) {
                                pocketedBalls[2].push(ball.colorIndex);
                            }

                            // Particle burst
                            for (let p = 0; p < 12; p++) {
                                particles.push(new Particle(ball.x, ball.y, COLORS[ball.colorIndex]));
                            }

                            pocketSound();

                            setTimeout(() => {
                                balls.splice(balls.indexOf(ball), 1);
                            }, 300);
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            const anyMoving = balls.some(b => b.isMoving());
            if (!anyMoving && dragging === false && shotTaken && !gameOver) {
                checkTurnEnd();
            }
        }

        function checkTurnEnd() {
            // Check if 8-ball was pocketed (win/loss condition)
            if (ballsPocketedThisTurn.includes(8)) {
                const playerBalls = balls.filter((b, idx) => {
                    return idx > 0 && isPlayerBall(b.colorIndex, currentPlayer);
                });

                if (playerBalls.length > 0) {
                    // Lost - pocketed 8-ball before clearing all own balls
                    gameOver = true;
                    winner = currentPlayer === 1 ? 2 : 1;
                    showWinner(true);
                    return;
                } else {
                    // Won - cleared all own balls and pocketed 8-ball
                    slowMotion = true;
                    setTimeout(() => {
                        gameOver = true;
                        winner = currentPlayer;
                        showWinner(false);
                    }, 500);
                    return;
                }
            }

            // Show combo if multiple balls were pocketed
            comboCount = ballsPocketedThisTurn.length;
            if (comboCount > 1) {
                showCombo();
            }

            // Update score for pocketed balls
            if (currentPlayer === 1) {
                player1Score += ballsPocketedThisTurn.filter(idx => isPlayerBall(idx, 1)).length;
            } else {
                player2Score += ballsPocketedThisTurn.filter(idx => isPlayerBall(idx, 2)).length;
            }

            // Clear turn-specific variables
            ballsPocketedThisTurn = [];
            shotTaken = false;

            // ALWAYS switch to the other player for the next turn (simple alternation)
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            isComputerTurn = gameMode === 'vscomputer' && currentPlayer === 2;
            computerHasShot = false;

            updateUI();

            // If it's now the computer's turn, schedule its shot
            if (isComputerTurn && !gameOver) {
                computerThinking = true;
                document.getElementById('aiThinkingIndicator').style.display = 'block';
                setTimeout(computerShoot, 1000);
            }
        }

        function showCombo() {
            const display = document.getElementById('comboDisplay');
            const texts = ['Double!', 'Triple!', 'Quad!', 'Legendary!'];
            const text = texts[Math.min(comboCount - 2, texts.length - 1)];
            display.textContent = text;
            display.style.display = 'block';
            setTimeout(() => {
                display.style.display = 'none';
            }, 1500);
        }

        function computerShoot() {
            // Guard: only shoot once per turn
            if (computerHasShot) return;
            computerHasShot = true;

            const whiteBall = balls[0];
            let targetBall = null;
            let minDist = Infinity;

            for (let ball of balls) {
                if (isPlayerBall(ball.colorIndex, 2)) {
                    const dist = Math.sqrt(
                        Math.pow(ball.x - whiteBall.x, 2) + Math.pow(ball.y - whiteBall.y, 2)
                    );
                    if (dist < minDist) {
                        minDist = dist;
                        targetBall = ball;
                    }
                }
            }

            if (targetBall) {
                const dx = targetBall.x - whiteBall.x;
                const dy = targetBall.y - whiteBall.y;
                const distance = Math.sqrt(dx * dx + dy * dy) || 1;
                const power = (Math.random() * 0.5 + 0.7) * 1.5;

                whiteBall.vx = (dx / distance) * power;
                whiteBall.vy = (dy / distance) * power;

                shotTaken = true;
                displayShotFeedback(Math.min(power / 1.5, 100));
            }

            computerThinking = false;
            document.getElementById('aiThinkingIndicator').style.display = 'none';
        }

        function showWinner(isLoss = false) {
            document.getElementById('winnerScreen').style.display = 'flex';
            if (isLoss) {
                document.getElementById('winnerText').textContent = `${winner === 1 ? player1Name : player2Name} Wins!`;
                document.getElementById('winnerSubtext').textContent = `${currentPlayer === 1 ? player1Name : player2Name} fouled on the 8-ball!`;
            } else {
                document.getElementById('winnerText').textContent = `${winner === 1 ? player1Name : player2Name} Wins!`;
                document.getElementById('winnerSubtext').textContent = `Pocketed the 8-ball!`;
            }

            if (winner === 1) {
                player1Wins++;
            } else {
                player2Wins++;
            }

            createConfetti();
            saveWins();
        }

        function updateUI() {
            document.getElementById('player1Name').textContent = player1Name;
            document.getElementById('player2Name').textContent = player2Name;

            updatePocketedBallsDisplay();

            const player1RemainingCount = balls.filter((b, idx) => idx > 0 && isPlayerBall(b.colorIndex, 1)).length;
            const player2RemainingCount = balls.filter((b, idx) => idx > 0 && isPlayerBall(b.colorIndex, 2)).length;
            document.getElementById('player1Remaining').textContent = `Balls remaining: ${player1RemainingCount}`;
            document.getElementById('player2Remaining').textContent = `Balls remaining: ${player2RemainingCount}`;

            if (currentPlayer === 1) {
                document.getElementById('player1Panel').className = 'player-panel active';
                document.getElementById('player2Panel').className = 'player-panel';
            } else {
                document.getElementById('player1Panel').className = 'player-panel';
                document.getElementById('player2Panel').className = 'player-panel active';
            }
        }

        function updatePocketedBallsDisplay() {
            const p1BallsHTML = pocketedBalls[1].map(idx =>
                `<div class="ball-icon" style="background-color: ${COLORS[idx]}; border-color: ${idx >= 9 ? '#fff' : 'rgba(255,255,255,0.5)'}; position: relative;">
                    ${idx >= 9 ? '<div style="width: 100%; height: 2px; background: white; position: absolute; top: 50%; left: 0; transform: translateY(-50%);"></div>' : ''}
                </div>`
            ).join('');
            const p2BallsHTML = pocketedBalls[2].map(idx =>
                `<div class="ball-icon" style="background-color: ${COLORS[idx]}; border-color: ${idx >= 9 ? '#fff' : 'rgba(255,255,255,0.5)'}; position: relative;">
                    ${idx >= 9 ? '<div style="width: 100%; height: 2px; background: white; position: absolute; top: 50%; left: 0; transform: translateY(-50%);"></div>' : ''}
                </div>`
            ).join('');

            document.getElementById('player1Balls').innerHTML = p1BallsHTML;
            document.getElementById('player2Balls').innerHTML = p2BallsHTML;
        }

        function saveWins() {
            localStorage.setItem('poolWins', JSON.stringify({
                player1: player1Wins,
                player2: player2Wins,
                player1Name: player1Name,
                player2Name: player2Name
            }));
        }

        function loadWins() {
            const saved = localStorage.getItem('poolWins');
            if (saved) {
                const data = JSON.parse(saved);
                player1Wins = data.player1 || 0;
                player2Wins = data.player2 || 0;
                player1Name = data.player1Name || 'Player 1';
                player2Name = data.player2Name || 'Player 2';
                document.getElementById('player1NameInput').value = player1Name;
                document.getElementById('player2NameInput').value = player2Name;
            }
        }

        function displayShotFeedback(power) {
            let feedback = 'Soft';
            if (power > 80) feedback = 'Boom!';
            else if (power > 60) feedback = 'Power shot!';
            else if (power > 40) feedback = 'Nice';

            const popup = document.createElement('div');
            popup.className = 'shot-feedback';
            popup.textContent = feedback;
            popup.style.left = (canvas.offsetLeft + 100) + 'px';
            popup.style.top = (canvas.offsetTop + 100) + 'px';
            document.body.appendChild(popup);

            let opacity = 1;
            const interval = setInterval(() => {
                opacity -= 0.05;
                popup.style.opacity = opacity;
                popup.style.transform = 'translateY(-' + (1 - opacity) * 50 + 'px)';
                if (opacity <= 0) {
                    clearInterval(interval);
                    popup.remove();
                }
            }, 50);
        }

        function drawTableTexture() {
            // Wood border effect
            ctx.fillStyle = '#4a3728';
            for (let i = 0; i < 20; i++) {
                ctx.fillRect(0, i * (TABLE_HEIGHT / 20), TABLE_WIDTH, 1);
            }

            // Felt vignette
            const vignette = ctx.createRadialGradient(TABLE_WIDTH / 2, TABLE_HEIGHT / 2, 100, TABLE_WIDTH / 2, TABLE_HEIGHT / 2, 600);
            vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
            vignette.addColorStop(1, 'rgba(0, 0, 0, 0.3)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, TABLE_WIDTH, TABLE_HEIGHT);

            // Light effect
            const light = ctx.createRadialGradient(200, 150, 300, 200, 150, 700);
            light.addColorStop(0, 'rgba(255, 255, 255, 0.1)');
            light.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = light;
            ctx.fillRect(0, 0, TABLE_WIDTH, TABLE_HEIGHT);
        }

        function draw() {
            // Base felt color
            ctx.fillStyle = '#0d5d0d';
            ctx.fillRect(0, 0, TABLE_WIDTH, TABLE_HEIGHT);

            drawTableTexture();

            ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
            for (let pocket of POCKETS) {
                ctx.beginPath();
                ctx.arc(pocket.x, pocket.y, POCKET_RADIUS, 0, Math.PI * 2);
                ctx.fill();

                // Pocket glow
                const glow = ctx.createRadialGradient(pocket.x, pocket.y, 0, pocket.x, pocket.y, POCKET_RADIUS * 2);
                glow.addColorStop(0, 'rgba(255, 215, 0, 0.2)');
                glow.addColorStop(1, 'rgba(255, 215, 0, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(pocket.x, pocket.y, POCKET_RADIUS * 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw aiming line with power feedback
            if (dragging && dragStart && dragCurrent) {
                const whiteBall = balls[0];
                const dragLength = Math.sqrt(Math.pow(dragCurrent.x - dragStart.x, 2) + Math.pow(dragCurrent.y - dragStart.y, 2));
                shotPower = Math.min(dragLength / 2, 100);

                // Power bar
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(whiteBall.x - 30, whiteBall.y - 50, 60, 8);

                let barColor = '#00ff00';
                if (shotPower > 60) barColor = '#ffff00';
                if (shotPower > 80) barColor = '#ff0000';
                ctx.fillStyle = barColor;
                ctx.fillRect(whiteBall.x - 30, whiteBall.y - 50, 60 * (shotPower / 100), 8);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(Math.round(shotPower) + '%', whiteBall.x, whiteBall.y - 35);

                // Cue stick
                const dx = dragStart.x - dragCurrent.x;
                const dy = dragStart.y - dragCurrent.y;
                const distance = Math.sqrt(dx * dx + dy * dy) || 1;
                const nx = dx / distance;
                const ny = dy / distance;

                const cueLength = 80 + shotPower;
                const cueStartX = whiteBall.x + nx * (BALL_RADIUS + 5);
                const cueStartY = whiteBall.y + ny * (BALL_RADIUS + 5);
                const cueEndX = cueStartX + nx * cueLength;
                const cueEndY = cueStartY + ny * cueLength;

                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(cueStartX, cueStartY);
                ctx.lineTo(cueEndX, cueEndY);
                ctx.stroke();

                // Aiming line
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3 + shotPower / 500)';
                ctx.lineWidth = 1 + shotPower / 50;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(dragStart.x, dragStart.y);
                ctx.lineTo(dragCurrent.x, dragCurrent.y);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            for (let ball of balls) {
                ball.draw();
            }

            for (let particle of particles) {
                particle.draw();
            }

            ctx.strokeStyle = '#8B6914';
            ctx.lineWidth = 2;
            ctx.strokeRect(WALL_PADDING, WALL_PADDING, TABLE_WIDTH - WALL_PADDING * 2, TABLE_HEIGHT - WALL_PADDING * 2);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Mouse events
        canvas.addEventListener('mousedown', (e) => {
            if (gameOver || isComputerTurn || shotTaken) return;

            const anyMoving = balls.some(b => b.isMoving());
            if (anyMoving) return; // Can't shoot while balls are moving

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const whiteBall = balls[0];
            const dx = x - whiteBall.x;
            const dy = y - whiteBall.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < whiteBall.radius + 20) {
                dragging = true;
                dragStart = { x: whiteBall.x, y: whiteBall.y };
                dragCurrent = { x, y };
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (dragging && dragStart) {
                const rect = canvas.getBoundingClientRect();
                dragCurrent = {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }
        });

        canvas.addEventListener('mouseup', () => {
            if (dragging && dragStart && dragCurrent) {
                const whiteBall = balls[0];
                const dx = dragStart.x - dragCurrent.x;
                const dy = dragStart.y - dragCurrent.y;
                const power = Math.sqrt(dx * dx + dy * dy) * 0.15;

                const distance = Math.sqrt(dx * dx + dy * dy) || 1;
                whiteBall.vx = (dx / distance) * power;
                whiteBall.vy = (dy / distance) * power;

                shotTaken = true; // Mark that a shot has been taken this turn

                const shotPowerPercent = Math.min(power / 1.5, 100);
                displayShotFeedback(shotPowerPercent);
                if (shotPowerPercent > 80) {
                    screenShake(8);
                }

                dragging = false;
                dragStart = null;
                dragCurrent = null;
            }
        });

        // Touch events
        canvas.addEventListener('touchstart', (e) => {
            if (gameOver || isComputerTurn || shotTaken) return;

            const anyMoving = balls.some(b => b.isMoving());
            if (anyMoving) return; // Can't shoot while balls are moving

            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            const whiteBall = balls[0];
            const dx = x - whiteBall.x;
            const dy = y - whiteBall.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < whiteBall.radius + 20) {
                dragging = true;
                dragStart = { x: whiteBall.x, y: whiteBall.y };
                dragCurrent = { x, y };
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (dragging && dragStart) {
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                dragCurrent = {
                    x: touch.clientX - rect.left,
                    y: touch.clientY - rect.top
                };
            }
        });

        canvas.addEventListener('touchend', () => {
            if (dragging && dragStart && dragCurrent) {
                const whiteBall = balls[0];
                const dx = dragStart.x - dragCurrent.x;
                const dy = dragStart.y - dragCurrent.y;
                const power = Math.sqrt(dx * dx + dy * dy) * 0.15;

                const distance = Math.sqrt(dx * dx + dy * dy) || 1;
                whiteBall.vx = (dx / distance) * power;
                whiteBall.vy = (dy / distance) * power;

                shotTaken = true; // Mark that a shot has been taken this turn

                const shotPowerPercent = Math.min(power / 1.5, 100);
                displayShotFeedback(shotPowerPercent);
                if (shotPowerPercent > 80) {
                    screenShake(8);
                }

                dragging = false;
                dragStart = null;
                dragCurrent = null;
            }
        });

        // Mode selection
        document.getElementById('twoPlayerBtn').addEventListener('click', () => {
            gameMode = '2player';
            document.getElementById('modeSelectScreen').style.display = 'none';
            document.getElementById('player2NameGroup').style.display = 'block';
            document.getElementById('player2Type').textContent = 'Stripes';
            document.getElementById('nameInputScreen').style.display = 'flex';
        });

        document.getElementById('vsComputerBtn').addEventListener('click', () => {
            gameMode = 'vscomputer';
            document.getElementById('modeSelectScreen').style.display = 'none';
            document.getElementById('player2NameGroup').style.display = 'none';
            player2Name = 'Computer';
            document.getElementById('player2Type').textContent = 'Stripes (AI)';
            document.getElementById('nameInputScreen').style.display = 'flex';
        });

        document.getElementById('startGameBtn').addEventListener('click', () => {
            player1Name = document.getElementById('player1NameInput').value || 'Player 1';
            if (gameMode === '2player') {
                player2Name = document.getElementById('player2NameInput').value || 'Player 2';
            }
            saveWins();
            document.getElementById('nameInputScreen').style.display = 'none';
            initGame();
            gameLoop();
        });

        document.getElementById('playAgainBtn').addEventListener('click', () => {
            document.getElementById('modeSelectScreen').style.display = 'flex';
        });

        loadWins();
        document.getElementById('player1Wins').textContent = `Wins: ${player1Wins}`;
        document.getElementById('player2Wins').textContent = `Wins: ${player2Wins}`;
        document.getElementById('modeSelectScreen').style.display = 'flex';
    </script>
</body>
</html>
