<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Shark</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #2d5016;
            font-family: Arial, sans-serif;
        }
        #title {
            color: #fff;
            font-size: 2.5em;
            font-weight: bold;
            margin: 20px 0 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        #gameWrapper {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        #gameContainer {
            position: relative;
            width: 1000px;
            height: 500px;
            background: #0d5d0d;
            border: 20px solid #3d2817;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            cursor: crosshair;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #fff;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 3px;
        }
        #sidebar {
            width: 150px;
            color: #fff;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
        }
        .player-box {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .player-box.active {
            background: #4CAF50;
            border: 2px solid #fff;
        }
        .player-box.inactive {
            background: rgba(255,255,255,0.1);
            opacity: 0.6;
        }
        .player-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .player-type {
            font-size: 11px;
            margin-bottom: 5px;
        }
        .player-score {
            font-size: 18px;
            font-weight: bold;
        }
        #winnerScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #winnerContent {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            color: #fff;
        }
        #winnerContent h1 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #FFD700;
        }
        #winnerContent p {
            font-size: 1.5em;
            margin-bottom: 30px;
        }
        #playAgainBtn {
            padding: 15px 40px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #playAgainBtn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="title">Pool Shark</div>
    <div id="gameWrapper">
        <div id="gameContainer">
            <canvas id="poolTable"></canvas>
            <div id="info">Drag to aim. Release to shoot.</div>
        </div>
        <div id="sidebar">
            <div class="player-box active" id="player1Box">
                <div class="player-name">Player 1</div>
                <div class="player-type" id="player1Type">Solids</div>
                <div class="player-score" id="player1Score">0</div>
            </div>
            <div class="player-box inactive" id="player2Box">
                <div class="player-name">Player 2</div>
                <div class="player-type" id="player2Type">Stripes</div>
                <div class="player-score" id="player2Score">0</div>
            </div>
        </div>
    </div>

    <div id="winnerScreen">
        <div id="winnerContent">
            <h1 id="winnerText">Player 1 Wins!</h1>
            <p id="winnerSubtext">Pocketed the 8-ball!</p>
            <button id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('poolTable');
        const ctx = canvas.getContext('2d');

        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        // Audio context for sound effects
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        // Game constants
        const BALL_RADIUS = 5;
        const FRICTION = 0.985;
        const POCKET_RADIUS = 8;
        const TABLE_WIDTH = canvas.width;
        const TABLE_HEIGHT = canvas.height;
        const WALL_PADDING = 15;
        const MIN_VELOCITY = 0.1;

        // Pockets positions
        const POCKETS = [
            { x: WALL_PADDING, y: WALL_PADDING },
            { x: TABLE_WIDTH / 2, y: WALL_PADDING },
            { x: TABLE_WIDTH - WALL_PADDING, y: WALL_PADDING },
            { x: WALL_PADDING, y: TABLE_HEIGHT - WALL_PADDING },
            { x: TABLE_WIDTH / 2, y: TABLE_HEIGHT - WALL_PADDING },
            { x: TABLE_WIDTH - WALL_PADDING, y: TABLE_HEIGHT - WALL_PADDING },
        ];

        // Ball colors
        const COLORS = [
            '#fff', // white
            '#ffeb3b', '#ffeb3b', '#4CAF50', '#4CAF50', '#F44336', '#F44336',
            '#9C27B0', '#9C27B0', '#FF9800', '#FF9800', '#2196F3', '#2196F3',
            '#F48FB1', '#F48FB1', '#000'
        ];

        // Sound generation functions
        function playSound(freq, duration, type = 'sine', volume = 0.3) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();

            osc.connect(gain);
            gain.connect(audioContext.destination);

            osc.frequency.value = freq;
            osc.type = type;

            gain.gain.setValueAtTime(volume, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + duration);
        }

        function ballCollisionSound() {
            playSound(400, 0.1, 'sine', 0.2);
            playSound(600, 0.08, 'sine', 0.15);
        }

        function cushionSound() {
            playSound(200, 0.15, 'sine', 0.25);
        }

        function pocketSound() {
            playSound(800, 0.1, 'sine', 0.3);
            setTimeout(() => playSound(1200, 0.15, 'sine', 0.3), 50);
        }

        // Game state
        let balls = [];
        let gameState = 'playing';
        let currentPlayer = 1; // 1 or 2
        let player1Score = 0;
        let player2Score = 0;
        let ballsPocketedThisTurn = [];
        let gameOver = false;
        let winner = null;

        let dragging = false;
        let dragStart = null;
        let dragCurrent = null;

        class Ball {
            constructor(x, y, colorIndex = 0) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.colorIndex = colorIndex;
                this.radius = BALL_RADIUS;
                this.scale = 1;
                this.pocketAnimation = false;
            }

            update() {
                if (this.pocketAnimation) return;

                this.vx *= FRICTION;
                this.vy *= FRICTION;

                if (Math.abs(this.vx) < MIN_VELOCITY) this.vx = 0;
                if (Math.abs(this.vy) < MIN_VELOCITY) this.vy = 0;

                this.x += this.vx;
                this.y += this.vy;

                // Wall bounces
                if (this.x - this.radius < WALL_PADDING) {
                    this.x = WALL_PADDING + this.radius;
                    this.vx *= -0.95;
                    cushionSound();
                }
                if (this.x + this.radius > TABLE_WIDTH - WALL_PADDING) {
                    this.x = TABLE_WIDTH - WALL_PADDING - this.radius;
                    this.vx *= -0.95;
                    cushionSound();
                }
                if (this.y - this.radius < WALL_PADDING) {
                    this.y = WALL_PADDING + this.radius;
                    this.vy *= -0.95;
                    cushionSound();
                }
                if (this.y + this.radius > TABLE_HEIGHT - WALL_PADDING) {
                    this.y = TABLE_HEIGHT - WALL_PADDING - this.radius;
                    this.vy *= -0.95;
                    cushionSound();
                }
            }

            draw() {
                if (this.pocketAnimation) {
                    this.scale *= 0.92;
                    if (this.scale < 0.05) {
                        this.scale = 0;
                        return;
                    }
                }

                ctx.save();
                ctx.globalAlpha = Math.max(0, this.scale);
                ctx.scale(this.scale, this.scale);
                ctx.translate((this.x / this.scale - this.x) * 0.5, (this.y / this.scale - this.y) * 0.5);

                ctx.fillStyle = COLORS[this.colorIndex];
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                if (this.colorIndex > 0 && this.colorIndex < 15) {
                    ctx.strokeStyle = COLORS[this.colorIndex];
                    ctx.lineWidth = 1;
                    if (this.colorIndex % 2 === 0) {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.radius * 0.6, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }

                if (this.colorIndex === 15) {
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 8px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('8', this.x, this.y);
                }

                ctx.restore();
            }

            isMoving() {
                return Math.abs(this.vx) > MIN_VELOCITY || Math.abs(this.vy) > MIN_VELOCITY;
            }
        }

        function initGame() {
            balls = [];
            ballsPocketedThisTurn = [];
            gameOver = false;
            winner = null;
            currentPlayer = 1;
            player1Score = 0;
            player2Score = 0;
            gameState = 'playing';
            document.getElementById('winnerScreen').style.display = 'none';

            balls.push(new Ball(TABLE_WIDTH * 0.25, TABLE_HEIGHT / 2, 0));

            const startX = TABLE_WIDTH * 0.65;
            const startY = TABLE_HEIGHT / 2;
            const spacing = BALL_RADIUS * 2.5;
            let colorIndex = 1;

            for (let row = 0; row < 5; row++) {
                for (let col = 0; col <= row; col++) {
                    const x = startX + row * spacing;
                    const y = startY - (row * spacing) / 2 + col * spacing;
                    balls.push(new Ball(x, y, colorIndex));
                    colorIndex++;
                }
            }

            updateUI();
        }

        function checkPocketCollision(ball) {
            for (let pocket of POCKETS) {
                const dx = ball.x - pocket.x;
                const dy = ball.y - pocket.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < POCKET_RADIUS) {
                    return true;
                }
            }
            return false;
        }

        function checkBallCollision(ball1, ball2) {
            const dx = ball2.x - ball1.x;
            const dy = ball2.y - ball1.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const minDistance = ball1.radius + ball2.radius;

            if (distance < minDistance) {
                const nx = dx / distance;
                const ny = dy / distance;

                const dvx = ball2.vx - ball1.vx;
                const dvy = ball2.vy - ball1.vy;

                const dvDotN = dvx * nx + dvy * ny;

                if (dvDotN < 0) {
                    ball1.vx += dvDotN * nx;
                    ball1.vy += dvDotN * ny;
                    ball2.vx -= dvDotN * nx;
                    ball2.vy -= dvDotN * ny;

                    ballCollisionSound();

                    const overlap = (minDistance - distance) / 2 + 0.5;
                    ball1.x -= overlap * nx;
                    ball1.y -= overlap * ny;
                    ball2.x += overlap * nx;
                    ball2.y += overlap * ny;
                }
            }
        }

        function isPlayerBall(colorIndex, playerNum) {
            if (colorIndex === 0) return false; // white
            if (colorIndex === 15) return false; // 8-ball

            if (playerNum === 1) {
                return colorIndex % 2 === 1; // solids: 1,3,5,7,9,11,13
            } else {
                return colorIndex % 2 === 0; // stripes: 2,4,6,8,10,12,14
            }
        }

        function update() {
            if (gameOver) return;

            for (let ball of balls) {
                ball.update();
            }

            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    checkBallCollision(balls[i], balls[j]);
                }
            }

            for (let i = balls.length - 1; i >= 0; i--) {
                if (checkPocketCollision(balls[i])) {
                    const ball = balls[i];

                    if (ball.colorIndex === 0) {
                        ball.x = TABLE_WIDTH * 0.25;
                        ball.y = TABLE_HEIGHT / 2;
                        ball.vx = 0;
                        ball.vy = 0;
                    } else {
                        ball.pocketAnimation = true;
                        ballsPocketedThisTurn.push(ball.colorIndex);
                        pocketSound();

                        setTimeout(() => {
                            balls.splice(balls.indexOf(ball), 1);
                        }, 300);
                    }
                }
            }

            // Check if all balls stopped
            const anyMoving = balls.some(b => b.isMoving());
            if (!anyMoving && dragging === false) {
                checkTurnEnd();
            }
        }

        function checkTurnEnd() {
            if (ballsPocketedThisTurn.length === 0) {
                // No balls pocketed, switch player
                currentPlayer = currentPlayer === 1 ? 2 : 1;
            } else {
                // Check for 8-ball
                if (ballsPocketedThisTurn.includes(15)) {
                    // 8-ball pocketed!
                    gameOver = true;
                    winner = currentPlayer;
                    showWinner();
                    return;
                }

                // Check if all of player's balls are gone
                const playerBalls = balls.filter((b, idx) => {
                    return idx > 0 && isPlayerBall(b.colorIndex, currentPlayer);
                });

                if (playerBalls.length === 0) {
                    // Player pocketed all their balls but not 8-ball yet
                    // They need to pocket the 8-ball
                }

                // Update score and keep same player
                if (currentPlayer === 1) {
                    player1Score += ballsPocketedThisTurn.length;
                } else {
                    player2Score += ballsPocketedThisTurn.length;
                }
            }

            ballsPocketedThisTurn = [];
            updateUI();
        }

        function showWinner() {
            document.getElementById('winnerScreen').style.display = 'flex';
            document.getElementById('winnerText').textContent = `Player ${winner} Wins!`;
        }

        function updateUI() {
            document.getElementById('player1Score').textContent = player1Score;
            document.getElementById('player2Score').textContent = player2Score;

            if (currentPlayer === 1) {
                document.getElementById('player1Box').className = 'player-box active';
                document.getElementById('player2Box').className = 'player-box inactive';
            } else {
                document.getElementById('player1Box').className = 'player-box inactive';
                document.getElementById('player2Box').className = 'player-box active';
            }
        }

        function draw() {
            ctx.fillStyle = '#0d5d0d';
            ctx.fillRect(0, 0, TABLE_WIDTH, TABLE_HEIGHT);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            for (let pocket of POCKETS) {
                ctx.beginPath();
                ctx.arc(pocket.x, pocket.y, POCKET_RADIUS, 0, Math.PI * 2);
                ctx.fill();
            }

            if (dragging && dragStart && dragCurrent) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.setLineDash([5, 5]);
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(dragStart.x, dragStart.y);
                ctx.lineTo(dragCurrent.x, dragCurrent.y);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            for (let ball of balls) {
                ball.draw();
            }

            ctx.strokeStyle = '#8B6914';
            ctx.lineWidth = 2;
            ctx.strokeRect(WALL_PADDING, WALL_PADDING, TABLE_WIDTH - WALL_PADDING * 2, TABLE_HEIGHT - WALL_PADDING * 2);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Mouse events
        canvas.addEventListener('mousedown', (e) => {
            if (gameOver) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const whiteBall = balls[0];
            const dx = x - whiteBall.x;
            const dy = y - whiteBall.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < whiteBall.radius + 20) {
                dragging = true;
                dragStart = { x: whiteBall.x, y: whiteBall.y };
                dragCurrent = { x, y };
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (dragging && dragStart) {
                const rect = canvas.getBoundingClientRect();
                dragCurrent = {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }
        });

        canvas.addEventListener('mouseup', () => {
            if (dragging && dragStart && dragCurrent) {
                const whiteBall = balls[0];
                const dx = dragStart.x - dragCurrent.x;
                const dy = dragStart.y - dragCurrent.y;
                const power = Math.sqrt(dx * dx + dy * dy) * 0.15;

                const distance = Math.sqrt(dx * dx + dy * dy) || 1;
                whiteBall.vx = (dx / distance) * power;
                whiteBall.vy = (dy / distance) * power;

                dragging = false;
                dragStart = null;
                dragCurrent = null;
            }
        });

        // Touch events
        canvas.addEventListener('touchstart', (e) => {
            if (gameOver) return;

            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            const whiteBall = balls[0];
            const dx = x - whiteBall.x;
            const dy = y - whiteBall.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < whiteBall.radius + 20) {
                dragging = true;
                dragStart = { x: whiteBall.x, y: whiteBall.y };
                dragCurrent = { x, y };
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (dragging && dragStart) {
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                dragCurrent = {
                    x: touch.clientX - rect.left,
                    y: touch.clientY - rect.top
                };
            }
        });

        canvas.addEventListener('touchend', () => {
            if (dragging && dragStart && dragCurrent) {
                const whiteBall = balls[0];
                const dx = dragStart.x - dragCurrent.x;
                const dy = dragStart.y - dragCurrent.y;
                const power = Math.sqrt(dx * dx + dy * dy) * 0.15;

                const distance = Math.sqrt(dx * dx + dy * dy) || 1;
                whiteBall.vx = (dx / distance) * power;
                whiteBall.vy = (dy / distance) * power;

                dragging = false;
                dragStart = null;
                dragCurrent = null;
            }
        });

        document.getElementById('playAgainBtn').addEventListener('click', () => {
            initGame();
        });

        initGame();
        gameLoop();
    </script>
</body>
</html>
