<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool Shark</title>
<style>
  :root {
    --bg: #0d1110;
    --panel: #171d1b;
    --line: #2a3431;
    --text: #f1f4f2;
    --muted: #9aa8a2;
    --p1: #f6c21c;
    --p2: #4fa3ff;
    --accent: #3ddc84;
    --gold: #ffd54a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px;
    background: radial-gradient(ellipse at 50% 0%, #1d2a25 0%, var(--bg) 60%);
  }
  h1 {
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 800;
    letter-spacing: .04em;
    background: linear-gradient(180deg, #fff 0%, var(--gold) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hud {
    width: 100%;
    max-width: 1000px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 10px;
  }
  .panel {
    min-width: 0;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    opacity: .55;
    transition: opacity .25s, border-color .25s, box-shadow .25s;
  }
  #p1 { --pc: var(--p1); }
  #p2 { --pc: var(--p2); }
  .panel.active {
    opacity: 1;
    border-color: var(--pc);
    box-shadow: 0 0 0 1px var(--pc), 0 0 24px color-mix(in srgb, var(--pc) 45%, transparent);
  }
  .panel-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pname { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    flex: none;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .08em;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--pc);
    color: #111;
    visibility: hidden;
  }
  .panel.active .badge { visibility: visible; }
  .group { font-size: 12px; color: var(--muted); margin: 3px 0 8px; }
  .icons { display: flex; flex-wrap: wrap; gap: 4px; }
  .icon {
    width: 20px; height: 20px;
    border-radius: 50%;
    display: grid; place-items: center;
    box-shadow: inset -2px -3px 4px rgba(0,0,0,.35);
    opacity: .2;
    transition: opacity .3s, transform .3s;
  }
  .icon.in { opacity: 1; transform: scale(1.08); }
  .icon span {
    width: 11px; height: 11px;
    border-radius: 50%;
    background: #fbfaf4;
    color: #111;
    font-size: 8px; font-weight: 800; line-height: 11px; text-align: center;
  }
  .wins { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--gold); }
  .turn {
    min-width: 190px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 8px 14px;
    background: var(--panel);
    border: 2px solid var(--tc, var(--line));
    border-radius: 12px;
    transition: border-color .25s;
  }
  .turn .who { font-size: 19px; font-weight: 800; color: var(--tc, var(--text)); }
  .turn .status { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .table-wrap {
    position: relative;
    width: 100%;
    max-width: 1000px;
    aspect-ratio: 1000 / 540;
    border-radius: 18px;
    box-shadow: 0 30px 60px rgba(0,0,0,.6);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; max-width: 1000px; }
  .pop {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: clamp(16px, 3vw, 28px);
    font-weight: 900;
    color: #fff;
    white-space: nowrap;
    pointer-events: none;
    text-shadow: 0 2px 8px rgba(0,0,0,.85);
    animation: pop 1.1s ease-out forwards;
  }
  .pop.boom { color: #ff6b4a; font-size: clamp(22px, 4.4vw, 40px); }
  .pop.combo { color: var(--gold); font-size: clamp(26px, 5.5vw, 52px); animation-duration: 1.5s; }
  .pop.turnpop { font-size: clamp(18px, 3.4vw, 32px); animation-duration: 1.3s; }
  @keyframes pop {
    0%   { opacity: 0; transform: translate(-50%, -30%) scale(.6); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    30%  { transform: translate(-50%, -55%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -140%) scale(1); }
  }
  .overlay {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(0,0,0,.78);
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .card {
    width: 100%; max-width: 420px;
    background: var(--panel);
    border: 2px solid #2f3a37;
    border-radius: 16px;
    padding: 28px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .card h2 { font-size: 28px; margin-bottom: 6px; }
  .card p { color: var(--muted); margin-bottom: 14px; }
  label { display: block; text-align: left; font-size: 13px; font-weight: 700; margin: 12px 0 6px; }
  input {
    width: 100%;
    padding: 11px 12px;
    font-size: 16px;
    color: var(--text);
    background: #0f1413;
    border: 2px solid #34413d;
    border-radius: 10px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    margin-top: 18px;
    padding: 13px 28px;
    font-size: 17px; font-weight: 800;
    color: #08210f;
    background: var(--accent);
    border: none; border-radius: 10px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  #winTitle { color: var(--gold); font-size: 34px; }
  #winTally { color: var(--text); font-weight: 700; }
  .confetti {
    position: fixed; top: -14px;
    width: 9px; height: 14px;
    z-index: 20;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot)); } }
  @media (max-width: 640px) {
    .hud { grid-template-columns: 1fr 1fr; }
    .turn { grid-column: 1 / -1; order: 3; min-width: 0; }
    .panel { padding: 8px; }
    .icon { width: 16px; height: 16px; }
    .icon span { display: none; }
  }
</style>
</head>
<body>
  <h1>Pool Shark</h1>

  <header class="hud">
    <section class="panel" id="p1">
      <div class="panel-top"><div class="pname" id="p1name">Player 1</div><div class="badge">YOUR TURN</div></div>
      <div class="group" id="p1group">Solids · 1–7</div>
      <div class="icons" id="p1icons"></div>
      <div class="wins" id="p1wins">Wins: 0</div>
    </section>
    <div class="turn" id="turn">
      <div class="who" id="turnWho">Pool Shark</div>
      <div class="status" id="turnStatus">Enter names to start</div>
    </div>
    <section class="panel" id="p2">
      <div class="panel-top"><div class="pname" id="p2name">Player 2</div><div class="badge">YOUR TURN</div></div>
      <div class="group" id="p2group">Stripes · 9–15</div>
      <div class="icons" id="p2icons"></div>
      <div class="wins" id="p2wins">Wins: 0</div>
    </section>
  </header>

  <div class="table-wrap" id="wrap">
    <canvas id="table" aria-label="Pool table"></canvas>
  </div>
  <p class="hint">Drag back from the white ball and release to shoot. The farther you pull, the harder the shot.</p>

  <div class="overlay show" id="nameScreen">
    <form class="card" id="nameForm">
      <h2>Pool Shark</h2>
      <p>Two players, one table. Solids vs stripes.</p>
      <label for="n1">Player 1 — Solids (1–7)</label>
      <input id="n1" maxlength="16" autocomplete="off" placeholder="Player 1">
      <label for="n2">Player 2 — Stripes (9–15)</label>
      <input id="n2" maxlength="16" autocomplete="off" placeholder="Player 2">
      <button type="submit">Start game</button>
    </form>
  </div>

  <div class="overlay" id="winScreen">
    <div class="card">
      <h2 id="winTitle">Winner!</h2>
      <p id="winReason"></p>
      <p id="winTally"></p>
      <button id="againBtn" type="button">Play again</button>
    </div>
  </div>

<script>
'use strict';

// ---------- Table geometry (logical units; the canvas is scaled to fit) ----------
const W = 1000, H = 540;
const L = 40, R = 960, T = 40, B = 500, MIDX = (L + R) / 2;
const BALL_R = 11;
const MAX_SPEED = 24;
const MAX_DRAG = 220;
const MIN_POWER = 0.03;
const CUSHION = 0.78;
const RESTITUTION = 0.95;
const ROLL_DAMP = 0.988;
const DECEL = 0.012;
const STOP_SPEED = 0.04;
const CORNER_MOUTH = 24, SIDE_MOUTH = 19;
const POCKETS = [
  { x: L, y: T, r: 25 }, { x: MIDX, y: T - 5, r: 21 }, { x: R, y: T, r: 25 },
  { x: L, y: B, r: 25 }, { x: MIDX, y: B + 5, r: 21 }, { x: R, y: B, r: 25 },
];
const HEAD = { x: L + (R - L) * 0.25, y: (T + B) / 2 };
const FOOT = { x: L + (R - L) * 0.72, y: (T + B) / 2 };
// 8-ball in the centre, one solid and one stripe in the back corners.
const RACK = [[1], [10, 2], [3, 8, 11], [12, 4, 13, 5], [6, 14, 7, 15, 9]];
const SOLIDS = [1, 2, 3, 4, 5, 6, 7];
const STRIPES = [9, 10, 11, 12, 13, 14, 15];
const GROUPS = [SOLIDS, STRIPES];
const GROUP_LABEL = ['Solids · 1–7', 'Stripes · 9–15'];
const PLAYER_COLOR = ['#f6c21c', '#4fa3ff'];
const BALL_COLORS = { 1: '#f6c21c', 2: '#1f4fd6', 3: '#d8262d', 4: '#6b2bb0', 5: '#f07a12', 6: '#178a43', 7: '#8f1f2a', 8: '#141414' };
const IVORY = '#f8f6ee';
const baseColor = n => n === 0 ? IVORY : BALL_COLORS[n > 8 ? n - 8 : n];
const burstColor = n => n === 8 ? '#ffd54a' : baseColor(n);

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const canvas = $('table');
const ctx = canvas.getContext('2d');
const wrap = $('wrap');

// ---------- State ----------
let dpr = 1;
let tableLayer = null;
let balls = [];
let names = ['Player 1', 'Player 2'];
let wins = Object.create(null);
let current = 0;
let phase = 'setup';            // setup | aiming | rolling | over
let shotPocketed = [];
let cueScratched = false;
let aim = null;                 // { id, x, y } while dragging
let hover = false;
let particles = [];
let glows = [];
let shake = 0, shakeMag = 0;
let timeScale = 1, slowTarget = 1;
let celebrating = false;
let gameId = 0;
let lastTime = 0;

// ---------- Storage ----------
const STORE = 'poolShark.v2';
const winKey = n => n.trim().toLowerCase();

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && d.wins && typeof d.wins === 'object') Object.assign(wins, d.wins);
      if (d && Array.isArray(d.names)) names = [String(d.names[0] || 'Player 1'), String(d.names[1] || 'Player 2')];
      return;
    }
    const old = JSON.parse(localStorage.getItem('poolWins') || 'null');
    if (old) {
      names = [String(old.player1Name || 'Player 1'), String(old.player2Name || 'Player 2')];
      if (old.player1) wins[winKey(names[0])] = Number(old.player1) || 0;
      if (old.player2) wins[winKey(names[1])] = Number(old.player2) || 0;
    }
  } catch (e) { /* storage unavailable: play without persistence */ }
}

function saveStore() {
  try { localStorage.setItem(STORE, JSON.stringify({ names, wins })); } catch (e) { /* ignore */ }
}

const winsOf = p => wins[winKey(names[p])] || 0;

// ---------- Sound (Web Audio, no files) ----------
let audio = null;
const lastSound = {};

function ensureAudio() {
  try {
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audio = new AC();
    }
    if (audio && audio.state === 'suspended') audio.resume();
  } catch (e) { audio = null; }
}

function tone(freq, dur, { type = 'sine', vol = 0.2, endFreq = 0, delay = 0 } = {}) {
  if (!audio || audio.state !== 'running') return;
  const t = audio.currentTime + delay;
  const o = audio.createOscillator();
  const g = audio.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination);
  o.start(t);
  o.stop(t + dur + 0.02);
}

function ready(key, ms) {
  const now = performance.now();
  if (now - (lastSound[key] || 0) < ms) return false;
  lastSound[key] = now;
  return true;
}

function sndClick(speed) {
  if (!ready('click', 25)) return;
  const v = Math.min(0.35, 0.04 + speed * 0.03);
  tone(1800, 0.05, { type: 'triangle', vol: v, endFreq: 900 });
  tone(3200, 0.03, { vol: v * 0.5 });
}
function sndThud(speed) {
  if (speed < 0.4 || !ready('thud', 40)) return;
  tone(140, 0.14, { vol: Math.min(0.4, 0.05 + speed * 0.035), endFreq: 70 });
}
function sndPocket() {
  tone(220, 0.18, { type: 'triangle', vol: 0.35, endFreq: 90 });
  tone(660, 0.12, { vol: 0.16, delay: 0.08 });
  tone(990, 0.22, { vol: 0.14, delay: 0.15 });
}
function sndCue(power) { tone(480, 0.06, { type: 'square', vol: 0.05 + power * 0.12, endFreq: 200 }); }
function sndWin() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.35, { type: 'triangle', vol: 0.2, delay: i * 0.12 })); }

// ---------- Balls ----------
function makeBall(n, x, y) {
  return { n, x, y, vx: 0, vy: 0, state: 'table', sink: 0, sx: 0, sy: 0, px: 0, py: 0, trail: [] };
}

function setupBalls() {
  balls = [makeBall(0, HEAD.x, HEAD.y)];
  const gap = 0.6;
  const dx = (2 * BALL_R + gap) * Math.cos(Math.PI / 6);
  const dy = 2 * BALL_R + gap;
  RACK.forEach((row, i) => row.forEach((n, j) => {
    balls.push(makeBall(n, FOOT.x + i * dx, FOOT.y + (j - (row.length - 1) / 2) * dy));
  }));
}

const cueBall = () => balls[0];
const ballNo = n => balls.find(b => b.n === n);
const remaining = p => GROUPS[p].filter(n => ballNo(n).state === 'table').length;
const isBusy = () => balls.some(b => b.state === 'sinking' || (b.state === 'table' && (b.vx !== 0 || b.vy !== 0)));

// ---------- Physics ----------
const inMouthX = x => Math.abs(x - L) < CORNER_MOUTH || Math.abs(x - R) < CORNER_MOUTH || Math.abs(x - MIDX) < SIDE_MOUTH;
const inMouthY = y => Math.abs(y - T) < CORNER_MOUTH || Math.abs(y - B) < CORNER_MOUTH;

function collide(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const d2 = dx * dx + dy * dy;
  const min = 2 * BALL_R;
  if (d2 >= min * min || d2 === 0) return;
  const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
  const push = (min - d) / 2;
  a.x -= nx * push; a.y -= ny * push;
  b.x += nx * push; b.y += ny * push;
  const rv = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
  if (rv <= 0) return;
  const j = rv * (1 + RESTITUTION) / 2;
  a.vx -= j * nx; a.vy -= j * ny;
  b.vx += j * nx; b.vy += j * ny;
  sndClick(rv);
}

function step(h) {
  const live = balls.filter(b => b.state === 'table');
  for (const b of live) { b.x += b.vx * h; b.y += b.vy * h; }

  for (const b of live) {
    if (b.x - BALL_R < L && !inMouthY(b.y)) { b.x = L + BALL_R; sndThud(Math.abs(b.vx)); b.vx = -b.vx * CUSHION; b.vy *= 0.97; }
    else if (b.x + BALL_R > R && !inMouthY(b.y)) { b.x = R - BALL_R; sndThud(Math.abs(b.vx)); b.vx = -b.vx * CUSHION; b.vy *= 0.97; }
    if (b.y - BALL_R < T && !inMouthX(b.x)) { b.y = T + BALL_R; sndThud(Math.abs(b.vy)); b.vy = -b.vy * CUSHION; b.vx *= 0.97; }
    else if (b.y + BALL_R > B && !inMouthX(b.x)) { b.y = B - BALL_R; sndThud(Math.abs(b.vy)); b.vy = -b.vy * CUSHION; b.vx *= 0.97; }
  }

  for (let i = 0; i < live.length; i++) {
    for (let j = i + 1; j < live.length; j++) collide(live[i], live[j]);
  }

  for (const b of live) {
    const p = POCKETS.find(p => Math.hypot(b.x - p.x, b.y - p.y) < p.r);
    if (p) { sinkBall(b, p); continue; }
    // Safety net: a ball that slipped past the jaws still drops into the nearest pocket.
    if (b.x < L - 35 || b.x > R + 35 || b.y < T - 35 || b.y > B + 35) {
      const near = POCKETS.reduce((a, c) => Math.hypot(b.x - c.x, b.y - c.y) < Math.hypot(b.x - a.x, b.y - a.y) ? c : a);
      sinkBall(b, near);
    }
  }
}

function applyFriction(h) {
  for (const b of balls) {
    if (b.state !== 'table') continue;
    const s = Math.hypot(b.vx, b.vy);
    if (s === 0) continue;
    const ns = s * Math.pow(ROLL_DAMP, h) - DECEL * h;
    if (ns < STOP_SPEED) { b.vx = 0; b.vy = 0; }
    else { b.vx *= ns / s; b.vy *= ns / s; }
  }
}

// ---------- Game flow ----------
function sinkBall(b, p) {
  b.state = 'sinking';
  b.sink = 0;
  b.sx = b.x; b.sy = b.y;
  b.px = p.x; b.py = p.y;
  b.vx = 0; b.vy = 0;
  burst(p.x, p.y, burstColor(b.n));
  glows.push({ x: p.x, y: p.y, t: 0, color: burstColor(b.n) });
  sndPocket();

  if (phase !== 'rolling') return;

  if (b.n === 0) {
    cueScratched = true;
    popup('Scratch!', p.x, clampY(p.y + (p.y < H / 2 ? 50 : -50)));
    return;
  }

  shotPocketed.push(b.n);
  if (shotPocketed.length >= 2) {
    const words = ['', '', 'Double!', 'Triple!', 'Quad!', 'Unreal!'];
    popup(words[Math.min(shotPocketed.length, words.length - 1)], W / 2, H * 0.32, 'combo');
  }

  if (b.n === 8) {
    if (remaining(current) === 0) finishGame(current, `${names[current]} cleared their balls and sank the 8-ball!`, true);
    else finishGame(1 - current, `${names[current]} sank the 8-ball too early.`, false);
  }
  renderHud();
}

function respawnCue() {
  const cue = cueBall();
  const free = (x, y) => balls.every(b => b === cue || b.state !== 'table' || Math.hypot(b.x - x, b.y - y) > 2 * BALL_R + 1);
  let spot = { x: HEAD.x, y: HEAD.y };
  search:
  for (let ring = 0; ring < 40; ring++) {
    const count = Math.max(1, ring * 6);
    for (let k = 0; k < count; k++) {
      const a = (k / count) * Math.PI * 2;
      const x = HEAD.x + Math.cos(a) * ring * BALL_R;
      const y = HEAD.y + Math.sin(a) * ring * BALL_R;
      if (x < L + BALL_R || x > R - BALL_R || y < T + BALL_R || y > B - BALL_R) continue;
      if (free(x, y)) { spot = { x, y }; break search; }
    }
  }
  Object.assign(cue, { x: spot.x, y: spot.y, vx: 0, vy: 0, state: 'table', sink: 0, trail: [] });
  popup('Cue ball back in place', cue.x, clampY(cue.y - 45));
}

function endShot() {
  if (cueScratched) { respawnCue(); cueScratched = false; }
  shotPocketed = [];
  current = 1 - current;
  phase = 'aiming';
  renderHud();
  popup(`${names[current]}'s turn`, W / 2, H / 2, 'turnpop');
}

function finishGame(winner, reason, legal) {
  phase = 'over';
  aim = null;
  celebrating = legal;
  wins[winKey(names[winner])] = winsOf(winner) + 1;
  saveStore();
  renderHud();
  const id = gameId;
  setTimeout(() => {
    if (id !== gameId) return;
    celebrating = false;
    $('winTitle').textContent = `${names[winner]} wins!`;
    $('winReason').textContent = reason;
    $('winTally').textContent = `All-time: ${names[0]} ${winsOf(0)} – ${winsOf(1)} ${names[1]}`;
    $('winScreen').classList.add('show');
    confetti();
    sndWin();
  }, legal ? 1500 : 900);
}

function newGame() {
  gameId++;
  setupBalls();
  current = 0;
  phase = 'aiming';
  shotPocketed = [];
  cueScratched = false;
  aim = null;
  particles = [];
  glows = [];
  timeScale = 1;
  slowTarget = 1;
  celebrating = false;
  $('winScreen').classList.remove('show');
  renderHud();
  popup(`${names[0]} breaks!`, W / 2, H / 2, 'turnpop');
}

function shoot(power, dx, dy) {
  const cue = cueBall();
  cue.vx = dx * power * MAX_SPEED;
  cue.vy = dy * power * MAX_SPEED;
  phase = 'rolling';
  shotPocketed = [];
  cueScratched = false;
  sndCue(power);
  const pct = power * 100;
  const label = pct > 80 ? 'Boom!' : pct >= 60 ? 'Power shot!' : pct >= 30 ? 'Nice' : 'Soft';
  popup(label, cue.x, clampY(cue.y - 45), pct > 80 ? 'boom' : '');
  if (pct > 80) { shake = 0.35; shakeMag = 5 + (power - 0.8) * 40; }
  renderHud();
}

// ---------- HUD ----------
function renderHud() {
  for (const p of [0, 1]) {
    const k = p + 1;
    $('p' + k).classList.toggle('active', (phase === 'aiming' || phase === 'rolling') && current === p);
    $('p' + k + 'name').textContent = names[p];
    $('p' + k + 'wins').textContent = `Wins: ${winsOf(p)}`;
    const left = balls.length ? remaining(p) : 7;
    $('p' + k + 'group').textContent = left === 0 && phase !== 'setup'
      ? `${GROUP_LABEL[p]} · on the 8-ball!`
      : `${GROUP_LABEL[p]} · ${left} left`;

    const icons = $('p' + k + 'icons');
    icons.replaceChildren(...GROUPS[p].map(n => {
      const el = document.createElement('div');
      const col = baseColor(n);
      el.className = 'icon' + (balls.length && ballNo(n).state !== 'table' ? ' in' : '');
      el.style.background = n > 8 ? `linear-gradient(${IVORY} 0 24%, ${col} 24% 76%, ${IVORY} 76%)` : col;
      el.title = `Ball ${n}`;
      const num = document.createElement('span');
      num.textContent = n;
      el.appendChild(num);
      return el;
    }));
  }

  const turn = $('turn');
  if (phase === 'setup') {
    turn.style.removeProperty('--tc');
    $('turnWho').textContent = 'Pool Shark';
    $('turnStatus').textContent = 'Enter names to start';
  } else if (phase === 'over') {
    turn.style.removeProperty('--tc');
    $('turnWho').textContent = 'Game over';
    $('turnStatus').textContent = '';
  } else {
    turn.style.setProperty('--tc', PLAYER_COLOR[current]);
    $('turnWho').textContent = `${names[current]}'s turn`;
    $('turnStatus').textContent = phase === 'rolling' ? 'Balls rolling… wait for them to stop' : 'Drag back from the white ball to shoot';
  }
}

function clampY(y) { return Math.max(30, Math.min(H - 30, y)); }

function popup(text, x, y, cls = '') {
  const el = document.createElement('div');
  el.className = 'pop' + (cls ? ' ' + cls : '');
  el.textContent = text;
  el.style.left = (Math.max(80, Math.min(W - 80, x)) / W * 100) + '%';
  el.style.top = (y / H * 100) + '%';
  wrap.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function confetti() {
  const colors = ['#ffd54a', '#3ddc84', '#4fa3ff', '#ff5d73', '#ffffff', '#f07a12'];
  for (let i = 0; i < 140; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.setProperty('--dx', (Math.random() * 200 - 100) + 'px');
    c.style.setProperty('--rot', (Math.random() * 1440 - 720) + 'deg');
    c.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
    c.style.animationDelay = (Math.random() * 0.8) + 's';
    if (Math.random() < 0.4) c.style.borderRadius = '50%';
    document.body.appendChild(c);
    c.addEventListener('animationend', () => c.remove());
  }
}

// ---------- Effects ----------
function burst(x, y, color) {
  for (let i = 0; i < 24; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 1,
      decay: 0.015 + Math.random() * 0.02,
      size: 1.5 + Math.random() * 2.5,
      color: i % 3 === 0 ? '#ffffff' : color,
    });
  }
}

// ---------- Update ----------
function updateSlowMotion() {
  slowTarget = 1;
  if (phase === 'rolling' && remaining(current) === 0) {
    // The shooter is on the 8-ball: slow down when it's heading into a pocket.
    const e = ballNo(8);
    const sp = Math.hypot(e.vx, e.vy);
    if (e.state === 'table' && sp > 0.3) {
      const closing = POCKETS.some(p => {
        const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy);
        return d < 130 && (dx * e.vx + dy * e.vy) / (d * sp) > 0.8;
      });
      if (closing) slowTarget = 0.3;
    }
  }
  if (phase === 'over' && celebrating) slowTarget = 0.35;
}

function update(dt) {
  updateSlowMotion();
  timeScale += (slowTarget - timeScale) * Math.min(1, dt * 8);
  const frames = dt * 60 * timeScale;

  if (phase === 'rolling' || phase === 'over') {
    let maxV = 0;
    for (const b of balls) if (b.state === 'table') maxV = Math.max(maxV, Math.hypot(b.vx, b.vy));
    const n = Math.min(16, Math.max(1, Math.ceil(maxV * frames / (BALL_R * 0.5))));
    for (let i = 0; i < n; i++) { step(frames / n); applyFriction(frames / n); }
  }

  for (const b of balls) {
    if (b.state === 'table' && Math.hypot(b.vx, b.vy) > 3) {
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 14) b.trail.shift();
    } else if (b.trail.length) {
      b.trail.shift();
    }
    if (b.state === 'sinking') {
      b.sink += dt * timeScale / 0.28;
      const e = Math.min(1, b.sink);
      b.x = b.sx + (b.px - b.sx) * e;
      b.y = b.sy + (b.py - b.sy) * e;
      if (b.sink >= 1) { b.state = 'gone'; b.trail = []; }
    }
  }

  const f = dt * 60 * timeScale;
  for (const p of particles) {
    p.x += p.vx * f; p.y += p.vy * f;
    p.vx *= Math.pow(0.94, f); p.vy *= Math.pow(0.94, f);
    p.life -= p.decay * f;
  }
  particles = particles.filter(p => p.life > 0);
  for (const g of glows) g.t += dt;
  glows = glows.filter(g => g.t < 0.8);
  shake = Math.max(0, shake - dt);

  // A turn ends exactly once: when the shot's balls have all stopped.
  if (phase === 'rolling' && !isBusy()) endShot();
}

// ---------- Drawing ----------
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function buildTable() {
  const off = document.createElement('canvas');
  off.width = W * dpr; off.height = H * dpr;
  const g = off.getContext('2d');
  g.scale(dpr, dpr);
  const rand = rng(7);

  // Dark wooden rails
  roundRect(g, 0, 0, W, H, 18);
  const wood = g.createLinearGradient(0, 0, 0, H);
  wood.addColorStop(0, '#4a2412');
  wood.addColorStop(0.5, '#33180b');
  wood.addColorStop(1, '#241006');
  g.fillStyle = wood;
  g.fill();
  g.save();
  g.clip();
  for (let i = 0; i < 180; i++) {
    const y = rand() * H;
    g.strokeStyle = rand() < 0.5 ? `rgba(0,0,0,${0.08 + rand() * 0.12})` : `rgba(255,190,120,${0.03 + rand() * 0.05})`;
    g.lineWidth = 0.5 + rand() * 1.5;
    g.beginPath();
    g.moveTo(0, y);
    for (let x = 0; x <= W; x += 40) g.lineTo(x, y + Math.sin(x / 90 + i) * 2.5);
    g.stroke();
  }
  g.restore();
  g.strokeStyle = 'rgba(255,220,180,0.12)';
  g.lineWidth = 2;
  roundRect(g, 5, 5, W - 10, H - 10, 14);
  g.stroke();

  // Cushions
  g.fillStyle = '#0a4a28';
  g.fillRect(L - 12, T - 12, R - L + 24, B - T + 24);

  // Felt with texture, overhead light and vignette
  g.fillStyle = '#11703d';
  g.fillRect(L, T, R - L, B - T);
  const noise = document.createElement('canvas');
  noise.width = noise.height = 128;
  const ng = noise.getContext('2d');
  const img = ng.createImageData(128, 128);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = rand() * 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 14;
  }
  ng.putImageData(img, 0, 0);
  g.fillStyle = g.createPattern(noise, 'repeat');
  g.fillRect(L, T, R - L, B - T);

  const light = g.createRadialGradient(W / 2, H / 2, 30, W / 2, H / 2, 520);
  light.addColorStop(0, 'rgba(255,255,220,0.18)');
  light.addColorStop(1, 'rgba(255,255,220,0)');
  g.fillStyle = light;
  g.fillRect(L, T, R - L, B - T);

  const vig = g.createRadialGradient(W / 2, H / 2, 180, W / 2, H / 2, 600);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.5)');
  g.fillStyle = vig;
  g.fillRect(L, T, R - L, B - T);

  // Cushion shadow on the felt
  const edges = [
    [L, T, L, T + 14, L, T, R - L, 14],
    [L, B, L, B - 14, L, B - 14, R - L, 14],
    [L, T, L + 14, T, L, T, 14, B - T],
    [R, T, R - 14, T, R - 14, T, 14, B - T],
  ];
  for (const [x0, y0, x1, y1, rx, ry, rw, rh] of edges) {
    const sg = g.createLinearGradient(x0, y0, x1, y1);
    sg.addColorStop(0, 'rgba(0,0,0,0.35)');
    sg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = sg;
    g.fillRect(rx, ry, rw, rh);
  }

  // Head string and foot spot
  g.strokeStyle = 'rgba(255,255,255,0.07)';
  g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(HEAD.x, T); g.lineTo(HEAD.x, B); g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.18)';
  g.beginPath(); g.arc(FOOT.x, FOOT.y, 3, 0, Math.PI * 2); g.fill();

  // Diamonds on the rails
  g.fillStyle = '#e9dcc0';
  for (let k = 1; k < 8; k++) {
    if (k === 4) continue;
    const x = L + (R - L) * k / 8;
    for (const y of [14, H - 14]) { g.beginPath(); g.arc(x, y, 3, 0, Math.PI * 2); g.fill(); }
  }
  for (let k = 1; k < 4; k++) {
    const y = T + (B - T) * k / 4;
    for (const x of [14, W - 14]) { g.beginPath(); g.arc(x, y, 3, 0, Math.PI * 2); g.fill(); }
  }

  // Pockets
  for (const p of POCKETS) {
    g.fillStyle = '#1c1c1c';
    g.beginPath(); g.arc(p.x, p.y, p.r + 6, 0, Math.PI * 2); g.fill();
    const hole = g.createRadialGradient(p.x, p.y, 2, p.x, p.y, p.r + 2);
    hole.addColorStop(0, '#000');
    hole.addColorStop(0.75, '#050505');
    hole.addColorStop(1, '#262626');
    g.fillStyle = hole;
    g.beginPath(); g.arc(p.x, p.y, p.r + 2, 0, Math.PI * 2); g.fill();
  }
  return off;
}

function drawBall(x, y, n, s = 1, alpha = 1) {
  const r = BALL_R * s;
  if (r < 0.3) return;
  ctx.save();
  ctx.globalAlpha = alpha;

  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.clip();
  const col = baseColor(n);
  if (n >= 9) {
    ctx.fillStyle = IVORY;
    ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
    ctx.fillStyle = col;
    ctx.fillRect(x - r, y - r * 0.55, 2 * r, r * 1.1);
  } else {
    ctx.fillStyle = col;
    ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  if (n > 0) {
    ctx.fillStyle = '#fbfaf4';
    ctx.beginPath();
    ctx.arc(x, y, r * 0.48, 0, Math.PI * 2);
    ctx.fill();
    if (r > 5) {
      ctx.fillStyle = '#111';
      ctx.font = `700 ${Math.round(r * 0.62)}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(n), x, y + r * 0.04);
    }
  }
  const shade = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r * 1.05);
  shade.addColorStop(0, 'rgba(255,255,255,0.3)');
  shade.addColorStop(0.45, 'rgba(255,255,255,0)');
  shade.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = shade;
  ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  ctx.restore();

  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.ellipse(x - r * 0.38, y - r * 0.42, r * 0.22, r * 0.14, -0.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawTrails() {
  ctx.save();
  ctx.lineCap = 'round';
  for (const b of balls) {
    const tr = b.trail;
    if (tr.length < 2) continue;
    ctx.strokeStyle = b.n === 8 ? '#bbbbbb' : baseColor(b.n);
    for (let i = 1; i < tr.length; i++) {
      const k = i / tr.length;
      ctx.globalAlpha = k * 0.35;
      ctx.lineWidth = BALL_R * 1.6 * k;
      ctx.beginPath();
      ctx.moveTo(tr[i - 1].x, tr[i - 1].y);
      ctx.lineTo(tr[i].x, tr[i].y);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawAim(time) {
  const cue = cueBall();
  if (cue.state !== 'table') return;
  const color = PLAYER_COLOR[current];

  if (!aim) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.55 + Math.sin(time * 4) * 0.3;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(cue.x, cue.y, BALL_R + 7 + Math.sin(time * 4) * 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    return;
  }

  const dx = cue.x - aim.x, dy = cue.y - aim.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 2) return;
  const power = Math.min(dist / MAX_DRAG, 1);
  const ux = dx / dist, uy = dy / dist;

  // Aiming line: longer and thicker with power
  ctx.save();
  ctx.beginPath();
  ctx.rect(L, T, R - L, B - T);
  ctx.clip();
  const len = 60 + power * 380;
  ctx.strokeStyle = `rgba(255,255,255,${0.35 + power * 0.45})`;
  ctx.lineWidth = 1.5 + power * 3.5;
  ctx.lineCap = 'round';
  ctx.setLineDash([10, 8]);
  ctx.beginPath();
  ctx.moveTo(cue.x + ux * (BALL_R + 3), cue.y + uy * (BALL_R + 3));
  ctx.lineTo(cue.x + ux * (BALL_R + len), cue.y + uy * (BALL_R + len));
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = `rgba(255,255,255,${0.4 + power * 0.4})`;
  ctx.beginPath();
  ctx.arc(cue.x + ux * (BALL_R + len), cue.y + uy * (BALL_R + len), 2 + power * 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Cue stick: sits behind the ball and pulls back with power
  const tip = BALL_R + 4 + power * 70;
  const butt = tip + 330;
  const tx = cue.x - ux * tip, ty = cue.y - uy * tip;
  const bx = cue.x - ux * butt, by = cue.y - uy * butt;
  const px = -uy, py = ux;
  const stick = (ox, oy) => {
    ctx.beginPath();
    ctx.moveTo(tx + px * 2.5 + ox, ty + py * 2.5 + oy);
    ctx.lineTo(bx + px * 5.5 + ox, by + py * 5.5 + oy);
    ctx.lineTo(bx - px * 5.5 + ox, by - py * 5.5 + oy);
    ctx.lineTo(tx - px * 2.5 + ox, ty - py * 2.5 + oy);
    ctx.closePath();
  };
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  stick(6, 8);
  ctx.fill();
  const sg = ctx.createLinearGradient(tx, ty, bx, by);
  sg.addColorStop(0, '#3b6fb6');
  sg.addColorStop(0.02, '#3b6fb6');
  sg.addColorStop(0.021, '#f3efe4');
  sg.addColorStop(0.06, '#f3efe4');
  sg.addColorStop(0.061, '#e2bf85');
  sg.addColorStop(0.62, '#c99a5b');
  sg.addColorStop(0.621, '#2a1308');
  sg.addColorStop(0.8, '#5a2a12');
  sg.addColorStop(1, '#1d0d05');
  ctx.fillStyle = sg;
  stick(0, 0);
  ctx.fill();
  ctx.restore();

  // Power bar with percentage: green -> yellow -> red
  const bw = 84, bh = 10;
  let barX = Math.max(10, Math.min(W - bw - 10, cue.x - bw / 2));
  let barY = cue.y - BALL_R - 34;
  if (barY < 22) barY = cue.y + BALL_R + 22;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  roundRect(ctx, barX - 2, barY - 2, bw + 4, bh + 4, 6);
  ctx.fill();
  ctx.fillStyle = `hsl(${Math.round(120 * (1 - power))}, 90%, 50%)`;
  roundRect(ctx, barX, barY, Math.max(4, bw * power), bh, 5);
  ctx.fill();
  ctx.font = '800 14px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,0.8)';
  ctx.strokeText(`${Math.round(power * 100)}%`, barX + bw / 2, barY - 3);
  ctx.fillStyle = '#fff';
  ctx.fillText(`${Math.round(power * 100)}%`, barX + bw / 2, barY - 3);
  ctx.restore();
}

function draw(time) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (shake > 0) {
    const m = shakeMag * (shake / 0.35);
    ctx.translate((Math.random() * 2 - 1) * m, (Math.random() * 2 - 1) * m);
  }
  ctx.drawImage(tableLayer, 0, 0, W, H);

  for (const gl of glows) {
    const a = 1 - gl.t / 0.8;
    const rg = ctx.createRadialGradient(gl.x, gl.y, 0, gl.x, gl.y, 70);
    rg.addColorStop(0, gl.color);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a * 0.7;
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(gl.x, gl.y, 70, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  drawTrails();

  for (const b of balls) {
    if (b.state !== 'table') continue;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(b.x + 3, b.y + 4, BALL_R * 1.05, BALL_R * 0.95, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  for (const b of balls) {
    if (b.state === 'sinking') drawBall(b.x, b.y, b.n, 1 - Math.min(1, b.sink) * 0.85, 1 - Math.min(1, b.sink) * 0.6);
  }
  for (const b of balls) {
    if (b.state === 'table') drawBall(b.x, b.y, b.n);
  }

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  if (phase === 'aiming') drawAim(time);
}

function frame(t) {
  const dt = Math.min(0.05, (t - (lastTime || t)) / 1000);
  lastTime = t;
  update(dt);
  draw(t / 1000);
  requestAnimationFrame(frame);
}

function resize() {
  const next = Math.min(2, window.devicePixelRatio || 1);
  if (tableLayer && next === dpr) return;
  dpr = next;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  tableLayer = buildTable();
}

// ---------- Input (mouse and touch via pointer events) ----------
function toTable(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height, scale: W / r.width };
}

function nearCue(p) {
  const cue = cueBall();
  return cue.state === 'table' && Math.hypot(p.x - cue.x, p.y - cue.y) <= Math.max(BALL_R * 2.2, 36 * p.scale);
}

canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  if (phase !== 'aiming' || aim) return;
  const p = toTable(e);
  if (!nearCue(p)) return;
  aim = { id: e.pointerId, x: p.x, y: p.y };
  canvas.setPointerCapture(e.pointerId);
  canvas.style.cursor = 'grabbing';
  e.preventDefault();
});

canvas.addEventListener('pointermove', e => {
  const p = toTable(e);
  if (aim && e.pointerId === aim.id) {
    aim.x = p.x;
    aim.y = p.y;
    return;
  }
  const h = phase === 'aiming' && nearCue(p);
  if (h !== hover) { hover = h; canvas.style.cursor = h ? 'grab' : 'default'; }
});

canvas.addEventListener('pointerup', e => {
  if (!aim || e.pointerId !== aim.id) return;
  const cue = cueBall();
  const dx = cue.x - aim.x, dy = cue.y - aim.y;
  const dist = Math.hypot(dx, dy);
  aim = null;
  canvas.style.cursor = 'default';
  hover = false;
  const power = Math.min(dist / MAX_DRAG, 1);
  if (phase === 'aiming' && power >= MIN_POWER) shoot(power, dx / dist, dy / dist);
});

canvas.addEventListener('pointercancel', () => { aim = null; canvas.style.cursor = 'default'; });

// ---------- Screens ----------
$('nameForm').addEventListener('submit', e => {
  e.preventDefault();
  ensureAudio();
  const a = ($('n1').value.trim() || 'Player 1').slice(0, 16);
  let b = ($('n2').value.trim() || 'Player 2').slice(0, 16);
  if (winKey(a) === winKey(b)) b = (b.slice(0, 13) + ' 2');
  names = [a, b];
  saveStore();
  $('nameScreen').classList.remove('show');
  newGame();
});

$('againBtn').addEventListener('click', () => {
  $('winScreen').classList.remove('show');
  showNameScreen();
});

function showNameScreen() {
  phase = 'setup';
  $('n1').value = names[0];
  $('n2').value = names[1];
  $('nameScreen').classList.add('show');
  renderHud();
  $('n1').focus();
}

// ---------- Start ----------
loadStore();
resize();
window.addEventListener('resize', resize);
setupBalls();
showNameScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
